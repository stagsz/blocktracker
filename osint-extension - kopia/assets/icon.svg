<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#003366"/>

  <!-- Magnifying glass circle -->
  <circle cx="52" cy="52" r="28" fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Magnifying glass handle -->
  <line x1="72" y1="72" x2="92" y2="92" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Search target crosshair inside glass -->
